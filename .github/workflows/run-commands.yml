
name: AIOZ DePIN Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-aioz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar

      - name: Download AIOZ DePIN
        run: |
          curl -fL -o aioz-depin.tar.gz \
            https://github.com/AIOZNetwork/aioz-depin-cli/releases/download/v1.2.6/aioz-depin-linux-amd64-1.2.6.tar.gz

          tar -xzf aioz-depin.tar.gz
          mv aioz-depin-cli-linux-amd64 aioz-depin-cli
          chmod +x aioz-depin-cli

      - name: Verify installation
        run: |
          ./aioz-depin-cli version

      - name: Prepare node key
        env:
          AIOZ_KEY: ${{ secrets.AIOZ_PRIVATE_KEY_JSON }}
        run: |
          test -n "$AIOZ_KEY" || {
            echo "AIOZ_PRIVATE_KEY_JSON secret is missing"
            exit 1
          }

          mkdir -p "$HOME/.aioz"
          printf '%s' "$AIOZ_KEY" > "$HOME/.aioz/privkey.json"
          chmod 600 "$HOME/.aioz/privkey.json"

      - name: Start node and monitor
        run: |
          mkdir -p depin-data logs

          ./aioz-depin-cli start \
            --home depin-data \
            --priv-key-file "$HOME/.aioz/privkey.json" \
            > logs/node.log 2>&1 &

          NODE_PID=$!
          echo "$NODE_PID" > logs/node.pid

          cleanup() {
            kill "$NODE_PID" 2>/dev/null || true
            wait "$NODE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 10); do
            echo "================================"
            echo "AIOZ status check: minute $i"
            date -u

            ./aioz-depin-cli stats 2>&1 | tee -a logs/stats.log || true

            echo "Node process:"
            if kill -0 "$NODE_PID" 2>/dev/null; then
              echo "RUNNING"
            else
              echo "STOPPED"
              cat logs/node.log
              exit 1
            fi

            if [ "$i" -lt 10 ]; then
              sleep 60
            fi
          done

      - name: Save node data and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aioz-node-test-data
          path: |
            depin-data/
            logs/
          retention-days: 7
          if-no-files-found: warn
