
name: AIOZ DePIN Node Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aioz-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl tar procps

      - name: Download AIOZ DePIN CLI v1.2.5
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/AIOZNetwork/aioz-depin-cli/releases/download/v1.2.5/aioz-depin-linux-amd64-1.2.5.tar.gz" \
            -o aioz-depin.tar.gz

          mkdir -p aioz-extracted

          tar -xzf aioz-depin.tar.gz -C aioz-extracted

          CLI_BIN="$(find aioz-extracted -type f \
            -name 'aioz-depin-cli-linux-amd64' -print -quit)"

          if [ -z "$CLI_BIN" ]; then
            echo "ERROR: AIOZ CLI binary not found"
            find aioz-extracted -maxdepth 3 -type f
            exit 1
          fi

          cp "$CLI_BIN" ./aioz-depin-cli
          chmod +x ./aioz-depin-cli

          mkdir -p logs

          ./aioz-depin-cli version | tee cli-version.txt

      - name: Generate new wallet
        shell: bash
        run: |
          set -e

          ./aioz-depin-cli keytool new \
            --save-priv-key privkey.json \
            </dev/null >/dev/null 2>&1

          if [ ! -s privkey.json ]; then
            echo "ERROR: Private key was not generated"
            exit 1
          fi

          chmod 600 privkey.json

          echo "New wallet generated successfully"

      - name: Start node and monitor for 10 minutes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p logs depin-data

          echo "========== STARTING AIOZ NODE =========="

          ./aioz-depin-cli start \
            --home depin-data \
            --priv-key-file privkey.json \
            > logs/node.log 2>&1 &

          NODE_PID=$!
          echo "$NODE_PID" > node.pid

          echo "Started process PID: $NODE_PID"

          node_alive() {
            if kill -0 "$NODE_PID" 2>/dev/null; then
              return 0
            fi

            pgrep -f '[a]ioz-io' >/dev/null 2>&1
          }

          echo "Waiting 30 seconds for startup..."
          sleep 30

          if ! node_alive; then
            echo "ERROR: Node stopped during startup"
            echo "========== NODE LOG =========="
            tail -n 150 logs/node.log || true
            exit 1
          fi

          echo "Node appears to be running."

          set +e

          NODE_FAILED=0

          for i in {1..10}; do
            echo "========== MINUTE $i =========="

            if ! node_alive; then
              echo "ERROR: Node process stopped"
              NODE_FAILED=1
              break
            fi

            echo "Checking node statistics..."

            if timeout 30s ./aioz-depin-cli stats \
              --home depin-data \
              --priv-key-file privkey.json \
              2>&1 | tee -a logs/stats.log; then

              echo "Stats command completed."

            else
              STATS_CODE=$?
              echo "Stats command returned code: $STATS_CODE"
            fi

            if [ "$i" -lt 10 ]; then
              sleep 60
            fi
          done

          echo "========== REWARD BALANCE =========="

          timeout 60s ./aioz-depin-cli reward balance \
            --priv-key-file privkey.json \
            2>&1 | tee logs/rewards.log

          REWARD_CODE=$?

          echo "========== FINAL NODE LOG =========="
          tail -n 150 logs/node.log || true

          echo "========== PROCESS CHECK =========="
          ps aux | grep -E '[a]ioz|[d]epin' || true

          if [ "$NODE_FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Upload AIOZ backup and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aioz-depin-backup
          path: |
            privkey.json
            depin-data/
            logs/
            node.pid
            cli-version.txt
          if-no-files-found: warn
          retention-days: 7
