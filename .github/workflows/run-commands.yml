
name: AIOZ DePIN 40 Minute Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aioz-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl tar procps coreutils

      - name: Download AIOZ CLI v1.2.5
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/AIOZNetwork/aioz-depin-cli/releases/download/v1.2.5/aioz-depin-linux-amd64-1.2.5.tar.gz" \
            -o aioz-depin.tar.gz

          mkdir -p aioz-extracted

          tar -xzf aioz-depin.tar.gz -C aioz-extracted

          CLI_BIN="$(find aioz-extracted -type f \
            -name 'aioz-depin-cli-linux-amd64' -print -quit)"

          if [ -z "$CLI_BIN" ]; then
            echo "ERROR: CLI binary not found"
            find aioz-extracted -maxdepth 3 -type f
            exit 1
          fi

          cp "$CLI_BIN" ./aioz-depin-cli
          chmod +x ./aioz-depin-cli

          mkdir -p logs

          ./aioz-depin-cli version | tee cli-version.txt

      - name: Generate private key
        shell: bash
        run: |
          set -e

          ./aioz-depin-cli keytool new \
            --save-priv-key privkey.json \
            </dev/null >/dev/null 2>&1

          test -s privkey.json
          chmod 600 privkey.json

          echo "Private key generated successfully"

      - name: Start node and monitor for 40 minutes
        shell: bash
        run: |
          set -u

          mkdir -p logs depin-data

          MAX_BYTES=$((2 * 1024 * 1024 * 1024))
          INTERVALS=240

          echo "========== STORAGE CONFIGURATION =========="
          echo "Maximum monitored folder size: 2 GiB"
          echo "Monitoring interval: 10 seconds"
          echo "Test duration: approximately 40 minutes"

          echo "========== STARTING AIOZ NODE =========="

          ./aioz-depin-cli start \
            --home depin-data \
            --priv-key-file privkey.json \
            > logs/node.log 2>&1 &

          NODE_PID=$!
          echo "$NODE_PID" > node.pid

          echo "Node PID: $NODE_PID"

          echo "Waiting 30 seconds for startup..."
          sleep 30

          if ! kill -0 "$NODE_PID" 2>/dev/null; then
            echo "ERROR: Node stopped during startup"
            tail -n 150 logs/node.log || true
            exit 1
          fi

          echo "Node process is running"

          STORAGE_LIMIT_REACHED=0
          NODE_STOPPED=0

          for ((i=1; i<=INTERVALS; i++)); do

            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              echo "ERROR: Node process stopped"
              NODE_STOPPED=1
              break
            fi

            USED_BYTES=$(du -sb depin-data 2>/dev/null | awk '{print $1}')
            USED_BYTES=${USED_BYTES:-0}

            echo "Storage used: $USED_BYTES bytes"

            if [ "$USED_BYTES" -ge "$MAX_BYTES" ]; then
              echo "STORAGE LIMIT REACHED: 2 GiB"
              STORAGE_LIMIT_REACHED=1
              break
            fi

            if (( i % 6 == 0 )); then
              MINUTE=$((i / 6))

              echo "========== MINUTE $MINUTE / 40 =========="
              echo "========== NODE STATS =========="

              ./aioz-depin-cli stats \
                --home depin-data \
                2>&1 | tee -a logs/stats.log

              STATS_CODE=${PIPESTATUS[0]}
              echo "Stats exit code: $STATS_CODE"

              echo "========== STORAGE USAGE =========="
              echo "$USED_BYTES / $MAX_BYTES bytes"
            fi

            sleep 10
          done

          echo "========== MONITORING FINISHED =========="

          if [ "$STORAGE_LIMIT_REACHED" -eq 1 ]; then
            echo "Node stopped because monitored data reached 2 GiB"
          elif [ "$NODE_STOPPED" -eq 1 ]; then
            echo "Node stopped unexpectedly"
          else
            echo "40-minute monitoring period completed"
          fi

          echo "========== FINAL NODE STATS =========="

          ./aioz-depin-cli stats \
            --home depin-data \
            2>&1 | tee logs/final-stats.log

          echo "========== REWARD BALANCE =========="

          ./aioz-depin-cli reward balance \
            --home depin-data \
            --endpoint http://127.0.0.1:1317 \
            2>&1 | tee logs/rewards.log

          REWARD_CODE=${PIPESTATUS[0]}
          echo "Reward balance exit code: $REWARD_CODE"

          echo "========== FINAL NODE LOG =========="
          tail -n 150 logs/node.log || true

          echo "========== STOPPING NODE =========="

          if kill -0 "$NODE_PID" 2>/dev/null; then
            kill "$NODE_PID" || true
            wait "$NODE_PID" 2>/dev/null || true
          fi

          echo "Node stopped"

          if [ "$REWARD_CODE" -ne 0 ]; then
            echo "WARNING: Reward balance command failed"
          fi

      - name: Upload AIOZ backup and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aioz-depin-40min-backup
          path: |
            privkey.json
            depin-data/
            logs/
            node.pid
            cli-version.txt
          if-no-files-found: warn
          retention-days: 7
