name: Install AIOZ DePIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-aioz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar

      - name: Download AIOZ DePIN
        run: |
          curl -LO https://github.com/AIOZNetwork/aioz-depin-cli/releases/download/v1.2.6/aioz-depin-linux-amd64-1.2.6.tar.gz
          tar -xzf aioz-depin-linux-amd64-1.2.6.tar.gz
          mv aioz-depin-cli-linux-amd64 aioz-depin-cli
          chmod +x aioz-depin-cli

      - name: Verify installation
        run: |
          ./aioz-depin-cli version

      - name: Generate Private Key
        run: |
          ./aioz-depin-cli keytool new --save-priv-key privkey.json
          chmod 600 privkey.json

      - name: Start AIOZ Node
        run: |
          mkdir -p logs
          ./aioz-depin-cli start \
            --home depin-data \
            --priv-key-file privkey.json \
            > logs/node.log 2>&1 &
          echo $! > node.pid

      - name: Monitor Node
        run: |
          for i in {1..10}; do
            echo "===== Minute $i ====="
            ./aioz-depin-cli stats || true
            sleep 60
          done

      - name: Upload Node Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aioz-depin-backup
          path: |
            privkey.json
            depin-data/
            logs/
            node.pid
          retention-days: 7
