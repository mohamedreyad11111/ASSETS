
name: XMRig HashVault Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar ca-certificates openssl

      - name: Download XMRig
        run: |
          wget -O xmrig.tar.gz \
            https://github.com/xmrig/xmrig/releases/download/v6.26.0/xmrig-6.26.0-linux-static-x64.tar.gz

          echo "fc6f8ae5f64e4f17481f7e3be29a1c56949f216a998414188003eae1db20c9e5  xmrig.tar.gz" | sha256sum -c -

          mkdir xmrig
          tar -xzf xmrig.tar.gz -C xmrig

          BIN="$(find "$PWD/xmrig" -type f -name xmrig -perm /111 -print -quit)"
          test -n "$BIN"

          sudo install -m 0755 "$BIN" /usr/local/bin/xmrig
          xmrig --version

      - name: Test HashVault DNS
        run: |
          getent hosts pool.hashvault.pro

      - name: Test HashVault TLS
        run: |
          timeout 15 openssl s_client \
            -connect pool.hashvault.pro:443 \
            -servername pool.hashvault.pro \
            -brief < /dev/null

      - name: Test HashVault connection
        run: |
          echo "DNS and TLS checks completed."
          echo "XMRig installed successfully."

      - name: Connection test finished
        if: always()
        run: |
          echo "HashVault connection test finished."
