
name: XMRig Wallet Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t xmrig-test .

      - name: Verify XMRig
        run: docker run --rm xmrig-test --version

      - name: Verify HashVault TLS
        run: |
          timeout 10 openssl s_client \
            -connect pool.hashvault.pro:443 \
            -servername pool.hashvault.pro \
            -brief </dev/null
